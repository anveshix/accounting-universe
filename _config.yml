# Legacy Jekyll configuration for branch-based Pages builds.
# The supported deployment uses GitHub Actions to publish apps/web/dist instead.
exclude:
  - node_modules
  - packages/curriculum/node_modules
  - packages/engine/node_modules
  - apps/web/node_modules
  - apps/tutor-proxy/node_modules
  - packages
  - apps
  - e2e
  - tools
  - AGENTS.md
  - package.json
  - package-lock.json
  - "*.test.*"
